# Local development stack. Start everything with `make up`.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://researchpilot:researchpilot@db:5432/researchpilot
  TEST_DATABASE_URL: postgresql+asyncpg://researchpilot:researchpilot@db:5432/researchpilot_test
  REDIS_URL: redis://redis:6379/0

services:
  db:
    # Official Postgres 16 with the pgvector extension pre-installed.
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: researchpilot
      POSTGRES_PASSWORD: researchpilot
      POSTGRES_DB: researchpilot
    ports:
      - "5433:5432"  # host 5433: a local Postgres already uses 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchpilot -d researchpilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # Message queue between the API and the Celery worker. Not published to the host:
    # only containers on this network need it (and a local Redis already uses 6379).
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # live code reload; uploads land in backend/storage/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Same image and code as the API, different command: it consumes jobs from Redis.
    # watchfiles restarts the worker when Python files change (Celery has no reload).
    build: ./backend
    command: watchfiles --filter python "celery -A app.worker worker --loglevel=info --concurrency=2" app
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules  # keep Linux node_modules out of the macOS folder
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
